[options]
# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
admin_passwd = ${ADMIN_PASSWD:-admin}
db_host = ${DB_HOST:-db}
db_port = ${DB_PORT:-5432}
db_user = ${DB_USER:-odoo}
db_password = ${DB_PASSWORD:-odoo}

# ---------------------------------------------------------------------------
# Addons paths — extra addons directory holds the OCA management-system modules
# ---------------------------------------------------------------------------
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
http_port = 8069
longpolling_port = 8072
proxy_mode = True

# ---------------------------------------------------------------------------
# Performance / limits
# ---------------------------------------------------------------------------
workers = 4
max_cron_threads = 1
limit_memory_soft = 1342177280
limit_memory_hard = 1610612736
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_level = info
log_handler = :INFO

# ---------------------------------------------------------------------------
# Data directory for file store, sessions, etc.
# ---------------------------------------------------------------------------
data_dir = /var/lib/odoo
